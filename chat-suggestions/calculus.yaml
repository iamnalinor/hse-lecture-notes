    - "Не знаю, как рассказывать доказательство вслух, чтобы не потерять нить"
    - "Что считается верно отвеченным определением и что — нет?"
    - "Билет попался «страшный». Что делать, если не могу вспомнить доказательство?"
    - "Нужно ли помнить доказательства всех теорем или только избранных?"
    - "Почему на устном ответе спрашивают, где использовано каждое условие теоремы?"
    - "Как повторять определения и теоремы, чтобы не путать их между собой?"
  kr1:
    - "Всегда ли можно проверять индукцию на малых n, чтобы найти базу?"
    - "Не получается найти N(ε): неравенство слишком сложное"
    - "Что делать, если под корнем растет что-то быстрее степени?"
    - "Нашел предел из уравнения. Достаточно ли этого, чтобы решить задачу?"
    - "Как доказать расходимость, не перебирая все возможные пределы?"
    - "Как узнать по виду выражения, какую неопределенность я вижу?"
