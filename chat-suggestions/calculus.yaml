course:
  - "Почему матан начинается с логики и индукции, а не с производных?"
  - "Как не путать предел последовательности, предел функции и непрерывность?"
  - "(−1)ⁿ ограничена, но расходится. Почему ограниченности мало для предела?"
  - "Мне кажется, у строго возрастающей функции f′ > 0 всегда. Что тогда с x³ в нуле?"
  - "Почему из f′ < 0 у 1/x не следует, что она убывает на всей области определения?"
  - "Можно ли сократить o(x³) − o(x³)? Почему это не ноль?"
  - "Что будет, если на КР-1 я наберу 34 балла из 100 при пороге 35?"
  - "Что можно записать на листок для КР-2 и стоит ли тратить на него время?"
  - "Как готовиться к коллоквиуму: 18 вопросов, билет с доказательствами и ещё формулировки?"
  - "Репетицию коллоквиума можно зачесть вместо него. Стоит ли рисковать и идти на неё?"
  - "Как учить десятки теорем, чтобы не забыть условия?"
  - "Почему при устранимом разрыве нельзя считать предел только с одной стороны?"
  - "Почему при переходе к пределу строгое неравенство может стать нестрогим?"
  - "Зачем в теореме о наибольшем значении отрезок, если 1/x на (0; 1) непрерывна?"
  - "Почему нельзя применять правило Лопиталя везде, где я вижу 0/0?"
docs:
  01_sep04_logic_induction:
    - "Зачем писать формулы с кванторами, если можно сказать словами?"
    - "Отрицание «все деревья высокие» — «все деревья невысокие»?"
    - "Почему ∀x∃y и ∃y∀x — разные утверждения, если кванторы «про одно и то же»?"
    - "В индукции я предполагаю то, что нужно доказать. Это не порочный круг?"
    - "Проверил n = 1…5 и работает. Почему этого не хватает?"
    - "Зачем в неравенстве Бернулли условие x ≥ −1, если оно «и так верно»?"
  02_sep11_binomial_sequences:
    - "Как понять, нужны размещения или сочетания: порядок важен или нет?"
    - "Почему в биноме Ньютона сочетания, а не размещения?"
    - "Последовательность и множество её значений — это одно и то же?"
    - "Неограниченная последовательность — это та, что растет?"
    - "Почему ограниченность — «∃C ∀n», а не «∀n ∃C»?"
    - "Если отношение aₙ₊₁/aₙ > 1, значит, последовательность возрастает?"
  03_sep18_sequence_limit:
    - "Почему N зависит от ε, а не наоборот?"
    - "Последовательность стремится к пределу — значит, приближается к нему монотонно?"
    - "Не понимаю, откуда берется ε/2 в доказательстве предела суммы"
    - "Показал, что aₙ не стремится к 1. Значит, она расходится?"
    - "Ограниченная последовательность сходится?"
    - "Как огрублять неравенство, чтобы найти N(ε), и не сломать доказательство?"
  04_sep25_infinitesimal_sequences:
    - "Чем стремление к ∞ отличается от неограниченности?"
    - "Если aₙ → 0 и bₙ → ∞, то aₙbₙ → 0?"
    - "Чем «отделима от нуля» отличается от «все члены ненулевые»?"
    - "Почему из aₙ > bₙ не следует lim aₙ > lim bₙ?"
    - "Нельзя ли в разности √(n²+n) − n сразу отбросить «маленький» n?"
    - "Почему сумму n слагаемых, каждое из которых → 0, нельзя считать как сумму пределов?"
  05_oct02_supremum_weierstrass:
    - "Зачем аксиома непрерывности, если у ℚ и ℝ «одинаковые» арифметические законы?"
    - "Супремум — это наибольший элемент множества?"
    - "Достаточно ли проверить, что число — верхняя граница, чтобы оно было супремумом?"
    - "Если возрастающая последовательность ограничена числом C, она стремится к C?"
    - "Нашел предел из уравнения L = f(L). Почему этого мало?"
    - "Почему нельзя просто подставить 1 в основание (1 + 1/n)ⁿ?"
  06_oct09_subsequences_cauchy:
    - "Почему в теореме Больцано–Вейерштрасса важно число номеров, а не значений?"
    - "Если соседние члены сближаются, последовательность фундаментальна?"
    - "Зачем критерий Коши, если можно найти предел напрямую?"
    - "Верхний предел — это супремум последовательности?"
    - "Если сходится подпоследовательность, сходится ли вся последовательность?"
    - "Как быстро найти все частичные пределы и не пропустить ни одного?"
  07_oct16_limit_of_function:
    - "Почему в определении предела функции точку x₀ выкалывают?"
    - "Предел функции в точке — это её значение в этой точке?"
    - "Как подобрать δ(ε), если δ в ответе не должно зависеть от x?"
    - "Нашел одну последовательность, на которой f(xₙ) → A. Значит, предел равен A?"
    - "Почему lim g(f(x)) не всегда равен lim g(y)?"
    - "Зачем нужны оба определения — по Коши и по Гейне?"
  08_oct23_remarkable_limits:
    - "Почему sin x / x → 1 только в радианах?"
    - "Если f(n) → A, то и f(x) → A при x → +∞?"
    - "Неограниченная около точки функция — бесконечно большая?"
    - "Можно ли в сумме заменять sin x на x? Почему tg x − sin x дает ноль?"
    - "Откуда берется показатель в пределе вида 1^∞ и почему нельзя подставить 1?"
    - "Почему в доказательстве второго замечательного предела сначала берут [x]?"
  09_nov06_asymptotes_o_symbols:
    - "Что значит знак «=» в записи f = o(g), если это не равенство?"
    - "Если f ~ g, значит, f − g → 0?"
    - "Почему в сумме нельзя заменять слагаемые на эквивалентные?"
    - "Чем устранимый разрыв отличается от скачка и почему род считается именно так?"
    - "Если lim f(x)/x существует, значит, есть наклонная асимптота?"
    - "График не может пересекать асимптоту? Почему тогда пересекает?"
  10_nov13_continuous_functions:
    - "Почему теорема о промежуточном значении не говорит, что корень единственный?"
    - "Если f(a) и f(b) одного знака, значит, корней на отрезке нет?"
    - "Почему теорема Вейерштрасса не работает на интервале?"
    - "Зачем непрерывности односторонние пределы на концах отрезка?"
    - "Функция принимает каждое значение один раз — значит, у неё есть обратная. Это всегда так?"
    - "f⁻¹(y) — это 1/f(y)?"
  11_nov20_elementary_functions_derivative:
    - "Почему arcsin(sin x) не всегда равен x?"
    - "Касательная — это прямая, которая имеет с графиком одну общую точку?"
    - "Если функция непрерывна, она дифференцируема?"
    - "Откуда берется aˣ для иррационального x, если мы умеем умножать только рационально?"
    - "Почему (sin x)′ = cos x нельзя использовать, чтобы доказать sin x / x → 1?"
    - "Почему у x^(1/3) в нуле нет производной, а у x^(4/3) есть?"
  theory:
    - "Как теоремы про пределы последовательностей зависят друг от друга и с чего всё начинается?"
    - "В чём отличия соглашений курса от других учебников: N, возрастающая, бесконечно большая?"
    - "Какие определения предела легко перепутать: Коши, Гейне, на бесконечности?"
    - "Какие теоремы нужны на коллоквиуме, а какие можно использовать без доказательства?"
    - "Не понимаю, какие условия в теоремах нельзя убирать. Как их запомнить?"
    - "Чем одна и та же идея «зажать» в разных теоремах отличается?"
  program:
    - "Если пересдам КР, оценка заменится или усредняется?"
    - "Репетиция коллоквиума — это обязательно?"
    - "Можно ли зачесть оценку за репетицию вместо коллоквиума?"
    - "Если я не набрал порог на КР, что именно блокируется?"
    - "Итоговая оценка за курс — среднее семестров?"
    - "Когда экзамен и какие его части можно зачесть заранее?"
