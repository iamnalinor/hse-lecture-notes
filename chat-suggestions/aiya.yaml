course:
  - "Я раньше не писал на C. С чего начать, чтобы не отстать?"
  - "Зачем в курсе машина Тьюринга, если все пишут на реальных языках?"
  - "Я решил задачу сам, но код похож на чужой. Как не получить дисквалификацию?"
  - "Думал, код из интернета со ссылкой можно брать всегда. Что тогда запрещено?"
  - "Что значат AC, OK и RJ? Почему AC на контесте ещё не значит, что задачу засчитают?"
  - "Если в одном ДЗ принято меньше трёх задач, обнуляются все шесть ДЗ? Это правда?"
  - "Сколько баллов потеряю за задачу, если первая успешная посылка ушла через три дня после срока?"
  - "Как готовиться к экзамену, если в курсе три разные части?"
  - "Что будет, если на экзамене я наберу меньше 30 %, а всё остальное сдано хорошо?"
  - "Почему x % 2 == 1 не работает для отрицательных x, а x % 2 != 0 работает?"
  - "Думал, sizeof 'A' равен 1, ведь это char. Почему на деле он как у int?"
  - "Почему переполнение unsigned нормально, а знаковое — неопределённое поведение?"
  - "Если проблема останова неразрешима, почему я всё равно могу доказать, что мой цикл завершится?"
  - "Почему тезис Тьюринга–Чёрча нельзя просто доказать как теорему?"
  - "Как готовиться к КР по C, если она проходит на компьютерах в аудитории?"
docs:
  01_nov03_turing_machine:
    - "Почему алгоритм нельзя просто «описать словами»?"
    - "Тезис Тьюринга–Чёрча — это теорема? Почему его нельзя доказать?"
    - "Зачем бесконечная лента, если у компьютера память конечна?"
    - "Зачем нужны состояния? Разве головка не может «запомнить» сама?"
    - "Почему результат — всё слово на ленте, а не только ответ?"
    - "Как кодировать слова, чтобы не было неоднозначности?"
  02_nov10_undecidability:
    - "Если проблема останова неразрешима, значит, нельзя доказать завершение ни одной программы?"
    - "Вообще не вижу, как работает диагональный аргумент в доказательстве неразрешимости"
    - "Почему самоприменимость — частный случай останова, а не наоборот?"
    - "Моя МТ оставила на ленте лишние символы. Это важно?"
    - "Зачем сводить ленту в обе стороны к ленте с левым краем?"
    - "Чем модель фон Неймана лучше машины Тьюринга для программиста?"
  03_nov17_c_basics:
    - "Почему int — не всегда 4 байта?"
    - "Предупреждение компилятора — это ошибка? Зачем -Werror?"
    - "Программа работает, значит, в ней нет неопределенного поведения?"
    - "Чем статическая память отличается от динамической? Когда что брать?"
    - "Какой порядок байтов у моей машины и как это проверить?"
    - "Зачем нужен дополнительный код, если можно хранить знак отдельно?"
  04_nov24_integer_operations:
    - "Почему −17 % 5 равно −2, а не 3?"
    - "a > b > c не проверяет, что b между a и c. Почему?"
    - "Чем переполнение int отличается от переполнения unsigned?"
    - "Почему локальная переменная без инициализатора содержит мусор, а глобальная — ноль?"
    - "Почему −1 < 0u ложно?"
    - "i++ + ++i работает у меня по-разному. Это ошибка?"
  05_dec07_statements:
    - "Почему else относится не к тому if, под которым стоит?"
    - "Зачем в switch нужен break и когда его специально не ставят?"
    - "Чем while отличается от do-while на практике?"
    - "Почему цикл for (unsigned i = n; i >= 0; i--) не заканчивается?"
    - "Можно ли пользоваться goto, или это всегда плохо?"
    - "Как выйти сразу из двух вложенных циклов?"
  theory:
    - "Какие понятия про машину Тьюринга чаще всего путают?"
    - "Не вижу, как проблема останова связана с самоприменимостью"
    - "Какие категории поведения в C легко перепутать?"
    - "Как связаны дополнительный код и продвижение типов?"
    - "Что из теории нужно знать дословно на экзамене?"
    - "Чем моделирование отличается от вычисления функции?"
  program:
    - "Если на экзамене меньше 30 %, баллы за ДЗ пропадут?"
    - "А если в одном ДЗ приняли меньше трех задач, что тогда?"
    - "Штраф за просрочку считается от первой посылки или от сдачи?"
    - "ИИ можно использовать, чтобы документировать код?"
    - "Что считается заимствованием: идея, куски кода или структура решения?"
    - "Зачем нужно рецензирование кода и как его оценивают?"
