<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Конспекты лекций 1 курса ПИ ФКН ВШЭ 2026/27: алгебра, математический анализ, дискретная математика. Теория, глоссарий, подготовка к контрольным и коллоквиумам, PDF." />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#fcfbf7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1a1916" media="(prefers-color-scheme: dark)" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ru_RU" />
    <meta property="og:site_name" content="Конспекты ПИ ФКН" />
    <meta property="og:title" content="Конспекты ПИ ФКН" />
    <meta property="og:description" content="Конспекты лекций 1 курса ПИ ФКН ВШЭ 2026/27: алгебра, математический анализ, дискретная математика. Теория, глоссарий, подготовка к контрольным и коллоквиумам, PDF." />
    <title>Конспекты ПИ ФКН</title>
    <link href="%BASE_URL%favicon.svg" rel="icon" type="image/svg+xml" />
    <script>
      (function () {
        var saved;
        try {
          saved = localStorage.getItem("theme");
        } catch (_) {}
        var dark = saved ? saved === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        // The browser chrome follows the chosen theme, not only the system one.
        document.querySelectorAll('meta[name="theme-color"]').forEach(function (meta) {
          meta.removeAttribute("media");
          meta.content = dark ? "#1a1916" : "#fcfbf7";
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
