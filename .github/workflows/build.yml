name: Build notes

on:
  push:
    branches: ['**']   # на любой ветке — PDF в artifacts; релиз latest — только из main
    tags-ignore: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff
        run: uv run ruff check scripts tests

      - name: Lint notes
        run: uv run scripts/lint.py

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Cache TinyTeX
        uses: actions/cache@v6
        with:
          path: ~/.TinyTeX
          key: tinytex-${{ runner.os }}-${{ hashFiles('scripts/setup.sh') }}

      - name: Cache build outputs (TikZ → SVG)
        uses: actions/cache@v6
        with:
          path: .cache
          key: notes-cache-${{ github.sha }}
          restore-keys: notes-cache-

      - name: Install TeX and dependencies
        run: |
          ./scripts/setup.sh
          echo "$HOME/.TinyTeX/bin/x86_64-linux" >> "$GITHUB_PATH"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: web/.bun-version

      - name: Tests
        run: uv run pytest -q

      - name: Build PDF and HTML
        run: uv run scripts/build.py --strict

      - name: Collect PDFs
        run: |
          mkdir -p dist
          shopt -s nullglob
          for f in build/pdf/*/*.pdf; do
            course=$(basename "$(dirname "$f")")
            cp "$f" "dist/${course}_$(basename "$f")"
          done
          ls -la dist

      - name: Upload PDFs
        uses: actions/upload-artifact@v7
        with:
          name: pdf
          path: dist/*.pdf
          if-no-files-found: ignore

      - name: Upload site data
        uses: actions/upload-artifact@v7
        with:
          name: site-data
          path: build/site-data
          if-no-files-found: ignore

      - name: Publish rolling release «latest»
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && hashFiles('dist/*.pdf') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f latest
          git push -f origin latest
          gh release view latest >/dev/null 2>&1 || \
            gh release create latest --prerelease --title "Конспекты (последняя сборка main)" \
              --notes "PDF всех конспектов, теории и программ курсов, подготовки к КР и читлистов, собранные из main."
          gh release upload latest dist/*.pdf --clobber
          # --clobber only adds and replaces: drop PDFs that main no longer builds (e.g. the old
          # <course>-registry.pdf), so a saved link fails instead of serving a frozen copy.
          for asset in $(gh release view latest --json assets --jq '.assets[].name'); do
            [[ -f "dist/$asset" ]] || gh release delete-asset latest "$asset" --yes
          done

      - name: Sync chat search index (D1 + Vectorize)
        id: chat_index
        continue-on-error: true
        timeout-minutes: 120
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [[ -n "$CLOUDFLARE_ACCOUNT_ID" && -n "$CLOUDFLARE_API_TOKEN" ]]; then
            uv run python scripts/export_search_index.py --sync-remote --fail-on-vectorize-overflow
          else
            echo "Missing Cloudflare credentials for chat search index sync." >&2
            exit 1
          fi

      - name: Report stale chat search index
        if: steps.chat_index.outcome == 'failure'
        run: |
          echo "::warning::Chat search index sync failed. Check the sync logs and rerun Build notes on main."
          echo "Chat search index sync failed. Check the sync logs and rerun Build notes on main." >> "$GITHUB_STEP_SUMMARY"

  # Превью сайта для PR: тот же сайт, что собирает Pages, но из артефактов этого запуска.
  # Загружается новой версией (не деплоем) в Cloudflare Worker со статическими ассетами
  # (Worker создан вручную) с алиасом pr-<N>, собранной с BASE_PATH=/pr-<N>/. Открывается по адресу
  # https://hse-preview.nalinor.dev/pr-<N>/: маршрутизатор preview/ проксирует путь в алиас. Один домен на все
  # PR — его один раз прописывают в Telegram Login, Turnstile и ALLOWED_ORIGINS API чата.
  # Продакшен Worker'а не меняется. Ссылка — комментарием в PR, обновляется на каждый пуш.
  # PR из форков не деплоятся: им не положены секреты.
  preview:
    name: Site preview
    needs: build
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    env:
      WORKER: hse-lecture-notes
      ALIAS: pr-${{ github.event.pull_request.number }}
      PREVIEW_URL: https://hse-preview.nalinor.dev/pr-${{ github.event.pull_request.number }}/
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - name: Skip without Cloudflare secrets
        if: env.HAS_TOKEN != 'true'
        run: echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID не заданы — превью пропущено"

      - if: env.HAS_TOKEN == 'true'
        uses: actions/checkout@v7

      - if: env.HAS_TOKEN == 'true'
        uses: ./.github/actions/setup-web

      - if: env.HAS_TOKEN == 'true'
        uses: actions/download-artifact@v8
        with:
          name: site-data
          path: web/public/data

      - if: env.HAS_TOKEN == 'true'
        uses: actions/download-artifact@v8
        with:
          name: pdf
          path: web/public/pdf

      - name: Build the site like Pages does
        if: env.HAS_TOKEN == 'true'
        working-directory: web
        env:
          BASE_PATH: /pr-${{ github.event.pull_request.number }}/
          VITE_CHAT_API_URL: ${{ vars.VITE_CHAT_API_URL }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
          VITE_TELEGRAM_CLIENT_ID: ${{ vars.VITE_TELEGRAM_CLIENT_ID }}
        run: |
          find public/data -name index.html -delete
          shopt -s nullglob
          # Old links: <course>-<doc>.pdf before the switch to "_", <course>-registry.pdf before the theory rename.
          for f in public/pdf/*_*.pdf; do d=$(dirname "$f"); b=$(basename "$f"); cp "$f" "$d/${b/_/-}"; done
          for f in public/pdf/*_theory.pdf; do cp "$f" "${f%_theory.pdf}-registry.pdf"; done
          bun run scripts/validate-chat-config.ts
          bun run build
          # Превью не должно попадать в поиск
          printf '/*\n  X-Robots-Tag: noindex\n' > dist/_headers
          printf 'User-agent: *\nDisallow: /\n' > dist/robots.txt
          # Worker без кода, только статические ассеты; конфиг нужен лишь превью
          cat > wrangler.jsonc <<JSON
          {
            "name": "$WORKER",
            "compatibility_date": "2026-10-01",
            "workers_dev": false,
            "preview_urls": true,
            "assets": { "directory": "./dist", "not_found_handling": "single-page-application" }
          }
          JSON

      - name: Upload a preview version
        if: env.HAS_TOKEN == 'true'
        id: upload
        working-directory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MESSAGE: "PR #${{ github.event.pull_request.number }} ${{ github.event.pull_request.head.sha }}"
        run: |
          # wrangler-action ставит wrangler 3.x, а превью-алиасы и wrangler.jsonc нужны из 4.x
          set -o pipefail
          bunx wrangler@4.149.0 versions upload --preview-alias="$ALIAS" --message="$MESSAGE" 2>&1 | tee wrangler.out
          {
            echo "out<<WRANGLER_EOF"
            cat wrangler.out
            echo "WRANGLER_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Find the preview URLs
        if: env.HAS_TOKEN == 'true'
        id: urls
        env:
          OUT: ${{ steps.upload.outputs.out }}
        run: |
          alias=$(grep -oE 'https://'"$ALIAS"'-[a-z0-9.-]+\.workers\.dev' <<<"$OUT" | head -n1)
          if [ -z "$alias" ]; then
            echo "$OUT"
            echo "::error::в выводе wrangler нет ссылки превью — включены ли workers.dev и Preview URLs у Worker'а?"
            exit 1
          fi
          echo "alias=$alias/" >> "$GITHUB_OUTPUT"

      - name: Smoke test
        if: env.HAS_TOKEN == 'true'
        env:
          URL: ${{ env.PREVIEW_URL }}
        run: |
          # Новая версия раскатывается по Cloudflare не сразу: все проверки повторяются вместе до ~3 минут
          check() {
            curl --fail --silent "${URL}data/courses.json" >/dev/null || { echo "нет data/courses.json"; return 1; }
            curl --fail --silent "${URL}" | grep -q '<div id="root">' || { echo "нет оболочки"; return 1; }
            curl --fail --silent "${URL}algebra/theory/" | grep -q '<title>Алгебра: теория' || { echo "нет страницы теории"; return 1; }
            # Ассеты собраны под /pr-<N>/: оболочка должна ссылаться на них с этим префиксом
            curl --fail --silent "${URL}" | grep -q "src=\"/pr-${{ github.event.pull_request.number }}/assets/" || { echo "ассеты не под /pr-N/"; return 1; }
          }
          for i in $(seq 18); do
            check && exit 0
            sleep 10
          done
          echo "::error::превью ${URL} не прошло проверки"
          exit 1

      - name: Comment the preview link on the PR
        if: env.HAS_TOKEN == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          LINK: ${{ env.PREVIEW_URL }}
          SHA: ${{ github.event.pull_request.head.sha }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          MARKER='<!-- site-preview -->'
          BODY="$MARKER
          **Превью сайта:** $LINK

          Сборка коммита \`${SHA:0:7}\` (слитого с main), обновляется на каждый пуш. Чат и вход через Telegram работают: домен один на все PR."
          ID=$(gh api "repos/${{ github.repository }}/issues/$PR/comments" --paginate \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$MARKER\"))) | .id" | head -n1)
          if [ -n "$ID" ]; then
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$ID" -f body="$BODY" >/dev/null
          else
            gh pr comment "$PR" --repo "${{ github.repository }}" --body "$BODY"
          fi
