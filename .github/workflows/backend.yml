name: Backend API

# Tests, migrates D1, and deploys the Cloudflare Worker (`hse-lecture-notes-api`) on main;
# also the router of hse-preview.nalinor.dev (`preview/`).
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "preview/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - "preview/**"
      - ".github/workflows/backend.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    name: Typecheck & test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        working-directory: backend
        run: bun install --frozen-lockfile
      - name: Typecheck & test
        working-directory: backend
        run: bun run typecheck && bun test
      - name: Test the preview router
        run: bun test preview/tests
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify Worker, WebSocket Durable Object and D1 together
        working-directory: backend
        run: node integration/chat-workerd.mjs

  deploy:
    name: Migrate D1 & deploy Worker
    needs: verify
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        working-directory: backend
        run: bun install --frozen-lockfile
      - name: Initialize D1 schema and model routes
        working-directory: backend
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bun run scripts/admin.ts init-db --remote
      - name: Deploy Cloudflare Worker
        working-directory: backend
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bunx wrangler deploy
      - name: Deploy the preview router (hse-preview.nalinor.dev)
        working-directory: backend
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bunx wrangler deploy -c ../preview/wrangler.jsonc
