# Учебный план 1 курса ПИ ФКН, 2026/27: контактные часы по модулям, из «Рабочего учебного плана»
# (https://www.hse.ru/dbs/education/sp_UnitedWorkPlan_27819_22361.pdf → sources/common/curriculum/work1.pdf;
# утвержден 14.05.2026). Сборка кладет его на сайт как
# site-data/curriculum.json (scripts/curriculum.py), внизу главной рисуется диаграмма Ганта.
#
# hours — контактные часы в модулях 1–4 (колонки плана «Распределение контактных часов по модулям»);
# attestations — модули, где у дисциплины в плане стоит «А» (экзамен или оценка в этом модуле).
# Кредиты — за весь год. В таблицу не входят: физкультура, английский язык (факультатив) и внутренние
# экзамены без кредитов — они перечислены в excluded, чтобы суммы сверялись с шапкой плана. Кредиты excluded нужны подвалу диаграммы: показанные 57 + учебная практика 3 (физкультура — 0) = 60 строки «Вся образовательная программа»; английский (8) вне 60.

source: sources/common/curriculum/work1.pdf
title: Рабочий учебный план, 1 курс, 2026/2027
# Строка «Вся образовательная программа» плана: контактные часы по модулям, всё, что в плане есть, кроме
# факультативного английского языка.
plan_totals: [211, 231, 336, 328]

categories:
  - id: math
    label: Математика
    name: Математика
  - id: prog
    label: Программирование
    name: Программирование
  - id: other
    label: Непрофильные дисциплины
    name: Непрофильные дисциплины

# Границы модулей — типовой график учебного процесса НИУ ВШЭ на 2026/27 (приказ от 30.09.2026
# № 6.18-01/300926-8, https://www.hse.ru/mirror/pubs/share/1205356078.pdf; ПИ ФКН в списке программ с
# особым графиком нет). from — начало модуля, to — конец его сессии; study_to — последний учебный день
# (без сессии). breaks — каникулы внутри учебных дней модуля (весенние 02.05–08.05 в модуле 4). Сборка
# считает weeks модуля = (дни from…study_to без breaks) / 7, до 0,1: сайт красит полосу по часам в неделю
# (часы / weeks), чтобы модули разной длины были сопоставимы; подсветка идущего модуля — по from…to.
module_spans:
  - { module: 1, from: "2026-09-01", study_to: "2026-10-25", to: "2026-10-31" }
  - { module: 2, from: "2026-11-01", study_to: "2026-12-20", to: "2026-12-30" }
  - { module: 3, from: "2027-01-09", study_to: "2027-03-24", to: "2027-03-31" }
  - { module: 4, from: "2027-04-01", study_to: "2027-06-20", to: "2027-06-30" }

breaks:
  - { from: "2027-05-02", to: "2027-05-08" }

disciplines:
  - { id: algebra, name: Алгебра, short: Алгебра, category: math, credits: 8, hours: [28, 28, 44, 44], attestations: [2, 4] }
  - { id: calculus, name: Математический анализ, short: Матан, category: math, credits: 8, hours: [28, 28, 40, 40], attestations: [2, 4] }
  - { id: discrete, name: Дискретная математика, short: Дискра, category: math, credits: 8, hours: [28, 28, 40, 40], attestations: [2, 4] }

  - { id: aiya, name: Алгоритмы и алгоритмические языки, short: АиАЯ, category: prog, credits: 5, hours: [0, 62, 66, 0], attestations: [3] }
  - { id: arch, name: Архитектура ЭВМ и язык ассемблера, short: Архитектура ЭВМ, category: prog, credits: 3, hours: [0, 0, 0, 80], attestations: [4] }
  - { id: intro-prog, name: Введение в программирование, short: Введение в программирование, category: prog, credits: 3, hours: [24, 0, 0, 0], attestations: [1] }
  - { id: intro-se, name: Введение в программную инженерию, short: ВвПИ, category: prog, credits: 4, hours: [18, 18, 0, 0], attestations: [2] }
  - { id: cpp, name: Основы программирования на С++, short: С++, category: prog, credits: 5, hours: [0, 0, 40, 40], attestations: [4] }
  # 11 вариантов семинара (по выбору). Часы у семи — 10/14/20 (всего 44), у четырех (Android, iOS, веб,
  # кибербезопасность) — 14/14/20 (48); взяты самые частые. Аттестация — в модуле 3.
  - { id: nis, name: Научно-исследовательский семинар, short: НИС, category: prog, credits: 3, hours: [10, 14, 20, 0], attestations: [3], variants: 11 }

  - { id: history, name: История России, short: История, category: other, credits: 4, hours: [12, 16, 24, 24], attestations: [2, 4] }
  - { id: state, name: Основы российской государственности, short: ОРГ, category: other, credits: 2, hours: [26, 0, 0, 0], attestations: [1] }
  - { id: economics, name: Экономика, short: Экономика, category: other, credits: 3, hours: [0, 0, 16, 14], attestations: [4] }
  - { id: safety, name: Безопасность жизнедеятельности, short: БЖД, category: other, credits: 1, hours: [9, 9, 0, 0], attestations: [2] }

# Не показываются. in_plan_total: входят ли часы в строку «Вся образовательная программа».
excluded:
  - { name: Учебная практика, credits: 3, hours: [0, 0, 0, 0], in_plan_total: true, reason: срок «Ф» (фиксированный), часов по модулям нет; на диаграмме не показана }
  - { name: Физическая культура, credits: 0, hours: [28, 28, 44, 44], in_plan_total: true }
  - { name: Независимый экзамен по ИИ-грамотности, credits: 0, hours: [0, 0, 2, 0], in_plan_total: true }
  - { name: Внутренний экзамен по английскому языку, credits: 0, hours: [0, 0, 0, 2], in_plan_total: true }
  - { name: Английский язык (факультатив), credits: 8, hours: [20, 28, 40, 40], in_plan_total: false }
