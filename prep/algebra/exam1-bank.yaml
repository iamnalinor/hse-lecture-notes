    text: Выпишите формулу Эйлера и выражения для косинуса и синуса через экспоненту.
    refs: [def:lec11:euler, cor:lec11:euler-cos-sin]

  - id: def-fta-bezout
    kind: definition
    topic: bezout
    text: Сформулируйте основную теорему алгебры и теорему Безу.
    refs: [thm:lec11:fta, thm:lec12:bezout]

  - id: def-linear-factors
    kind: definition
    topic: bezout
