about: Тренировочные билеты к экзамену с примерными задачами.

ticket:
  - kind: proof
    title: Теорема с доказательством
    count: 1
    proofs: true
  - kind: definition
    title: Определения и формулировки
    count: 2
  - kind: problem
    title: Задачи
    count: 3

questions:
  # --- Доказательства (15 билетов) ---
  - id: proof-kronecker-capelli
    kind: proof
    topic: kronecker-capelli
    text: Сформулируйте и докажите теорему Кронекера–Капелли.
    refs: [thm:lec08:kronecker-capelli, rem:exam1:proof-kronecker-capelli]

  - id: proof-fsr-existence
    kind: proof
    topic: fsr-existence
    text: Дайте определение ФСР и докажите теорему о существовании ФСР однородной СЛАУ.
    refs: [def:lec09:fsr, thm:lec09:fsr-existence, rem:exam1:proof-fsr-existence]

  - id: proof-nonzero-solution
    kind: proof
    topic: nonzero-solution
    text: >-
      Сформулируйте и докажите критерий существования ненулевого решения однородной квадратной СЛАУ
      (как следствие теоремы о существовании ФСР).
    refs: [cor:lec09:nonzero-solution, rem:exam1:proof-nonzero-solution]

  - id: proof-homogeneous
    kind: proof
    topic: homogeneous
    text: Сформулируйте и докажите теорему о структуре общего решения однородной СЛАУ.
    refs: [thm:lec10:homogeneous, rem:exam1:proof-homogeneous]

  - id: proof-nonhomogeneous
    kind: proof
    topic: nonhomogeneous
    text: >-
      Сформулируйте и докажите теорему о структуре общего решения неоднородной СЛАУ
      (теорема для однородной системы считается известной).
    refs: [thm:lec10:nonhomogeneous, rem:exam1:proof-nonhomogeneous]

  - id: proof-trig-mult
    kind: proof
    topic: trig-mult
    text: Сформулируйте и докажите правила умножения и деления комплексных чисел в тригонометрической форме.
    refs: [thm:lec11:trig-mult, rem:exam1:proof-trig-mult]

  - id: proof-moivre
    kind: proof
    topic: moivre
    text: Выпишите формулу Муавра и докажите её.
    refs: [thm:lec11:moivre, rem:exam1:proof-moivre]

  - id: proof-roots
    kind: proof
    topic: roots
    text: Выпишите формулу для комплексных корней $n$-й степени и приведите её вывод.
    refs: [thm:lec11:roots, rem:exam1:proof-roots]

  - id: proof-bezout
    kind: proof
    topic: bezout
    text: Докажите теорему Безу и выведите разложение многочлена на линейные множители над $\mathbb{C}$.
    refs: [thm:lec12:bezout, cor:lec12:linear-factors, rem:exam1:proof-bezout]

  - id: proof-real-poly
