    text: Выпишите формулу смешанного произведения в правом ОНБ и критерий компланарности трёх векторов.
    refs: [thm:lec13:mixed-coords, cor:lec13:coplanar]

  - id: def-cartesian
    kind: definition
    topic: plane-equation
    text: Дайте определение прямоугольной декартовой системы координат (ПДСК).
    refs: [def:lec13:cartesian]

  - id: def-surface-normal
    kind: definition
    topic: plane-equation
    text: Что такое уравнение поверхности и его геометрический образ? Что такое нормальный вектор плоскости?
