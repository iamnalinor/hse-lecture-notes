  - id: prob-lu-extra
    kind: problem
    topic: lu
    text: >-
      Можно ли представить матрицу $A = \begin{pmatrix} 0 & 2 \\ 3 & 5 \end{pmatrix}$ в виде $LU$
      ($L$ — нижнетреугольная с единицами на диагонали)?
    answer: >-
      Нельзя: из элемента $(1, 1)$ произведения $LU$ следует $u_{11} = 0$, тогда элемент $(2, 1)$ равен
      $l_{21} u_{11} = 0 \ne 3$.

