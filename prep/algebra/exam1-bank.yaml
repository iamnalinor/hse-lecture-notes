  - id: prob-plane-dist-extra
    kind: problem
    topic: planes-lines
    text: Найдите расстояние от точки $M_0(3, -1, 2)$ до плоскости $2x + y - 2z + 8 = 0$.
    answer: 'По формуле расстояния: $\rho = \dfrac{|2\cdot 3 - 1 - 2\cdot 2 + 8|}{\sqrt{4 + 1 + 4}} = \dfrac{9}{3} = 3$.'

