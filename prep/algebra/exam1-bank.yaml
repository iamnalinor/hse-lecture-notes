  - id: def-plane-equation
    kind: definition
    topic: plane-equation
    text: Сформулируйте теорему об общем уравнении плоскости в ПДСК.
    refs: [thm:lec14:plane-equation]

  - id: def-intercepts
    kind: definition
    topic: planes-lines
    text: Выпишите уравнение плоскости в отрезках и объясните геометрический смысл параметров.
    refs: [def:lec14:intercepts]

  - id: def-two-planes
    kind: definition
    topic: positions
    text: Опишите случаи взаимного расположения двух плоскостей в пространстве и критерий для каждого из них.
    answer: >-
      Для плоскостей $A_1 x + B_1 y + C_1 z + D_1 = 0$ и $A_2 x + B_2 y + C_2 z + D_2 = 0$ матрица
      $F = \begin{pmatrix} A_1 & B_1 & C_1 \\ A_2 & B_2 & C_2 \end{pmatrix}$ составлена из координат нормалей,
      а $G = \begin{pmatrix} A_1 & B_1 & C_1 & D_1 \\ A_2 & B_2 & C_2 & D_2 \end{pmatrix}$ получена добавлением
      столбца свободных коэффициентов.
    refs: [thm:lec14:two-planes]

  - id: def-angles-plane-line
    kind: definition
    topic: positions
    text: Выпишите формулы угла между двумя плоскостями и угла между прямой и плоскостью.
    refs: [def:lec14:angle-planes, def:lec14:angle-line-plane]

  - id: def-line-equations
    kind: definition
    topic: planes-lines
    text: Выпишите векторное, параметрические, канонические и общие уравнения прямой в пространстве.
    answer: >-
      Через точку $M_0(x_0, y_0, z_0)$ с направляющим вектором $\vec s = (s_1, s_2, s_3) \ne \vec 0$:
      векторное $\vec r = \vec r_0 + t\vec s$;
      параметрические $x = x_0 + s_1 t$, $y = y_0 + s_2 t$, $z = z_0 + s_3 t$;
      канонические $\frac{x - x_0}{s_1} = \frac{y - y_0}{s_2} = \frac{z - z_0}{s_3}$
      (при $s_i = 0$ это не деление на ноль, а соглашение: соответствующий числитель равен нулю, например $s_1 = 0 \Rightarrow x = x_0$);
      общие — система двух пересекающихся плоскостей $A_1 x + B_1 y + C_1 z + D_1 = 0$,
      $A_2 x + B_2 y + C_2 z + D_2 = 0$ с неколлинеарными нормалями.
    refs: [def:lec14:direction]

  - id: def-line-plane
    kind: definition
