    text: Что такое симметрическая группа $S_n$ (сколько в ней элементов), общая линейная группа $GL_n(\R)$ и специальная линейная группа $SL_n(\R)$?
    refs: [def:lec16:symmetric, def:lec16:gl, def:lec16:sl]

  - id: def-order-cayley
    kind: definition
    topic: groups
    text: Что такое порядок группы и таблица Кэли конечной группы?
    refs: [def:lec16:order, def:lec16:cayley]

  - id: def-homomorphism-iso
    kind: definition
    topic: groups
    text: Дайте определения гомоморфизма и изоморфизма групп; приведите примеры.
    answer: 'Примеры: $\det\colon GL_n(\R) \to (\R \setminus \{0\}, \cdot)$ — гомоморфизм; $\ln\colon (\R_{>0}, \cdot) \to (\R, +)$ и $D_3 \cong S_3$ — изоморфизмы.'
    refs: [def:lec16:homomorphism, def:lec16:iso]

  - id: def-iso-props
    kind: definition
    topic: groups
    text: Сформулируйте свойства тождественного отображения, обратного к изоморфизму и композиции гомоморфизмов (изоморфизмов).
    refs: [prop:lec16:iso-props]

  - id: def-cyclic-order
    kind: definition
    topic: groups
    text: Дайте определения циклической группы и порядка элемента группы; приведите пример.
    answer: 'Пример: $(\Z_n, +) = \langle \bar 1 \rangle$ — циклическая группа порядка $n$; в $(\Z_6, +)$ имеем $\operatorname{ord} \bar 2 = 3$.'
    refs: [def:lec17:cyclic, def:lec17:order]

  - id: def-cyclic-iso
    kind: definition
    topic: groups
    text: Сформулируйте теорему о классификации циклических групп с точностью до изоморфизма.
    refs: [thm:lec17:cyclic-iso]

  - id: def-subgroup
    kind: definition
    topic: subgroup-criterion
    text: Дайте определение подгруппы; приведите пример группы и её собственной подгруппы.
    answer: 'Пример: $SL_n(\R) \le GL_n(\R)$ или $2\Z \le (\Z, +)$.'
    refs: [def:lec16:subgroup]

  # --- Задачи (21 со страницы + 8 новых = 29 вопросов) ---
  - id: prob-slau-general
    kind: problem
    topic: slau
    text: >-
      Исследуйте систему $\{x_1 + x_2 + x_3 + x_4 = 2,\ 2x_1 + x_2 + 3x_3 = 5,\ x_1 - x_2 + 3x_3 - 3x_4 = 4\}$
      на совместность и запишите общее решение с выделенным частным решением и ФСР.
    refs: [prob:exam1:slau-general]

  - id: prob-slau-is-fsr
    kind: problem
    topic: slau
    text: >-
      Для системы $\{x_1 + x_2 - x_3 + 2x_4 = 0,\ 2x_1 + x_2 + x_3 + x_4 = 0\}$ и столбцов
      $v_1 = (-1, 0, 1, 1)^T$, $v_2 = (-3, 6, 1, -1)^T$, $v_3 = (2, -6, 0, 2)^T$, $v_4 = (1, 1, 0, 1)^T$
      выясните, какие пары образуют ФСР.
    refs: [prob:exam1:slau-is-fsr]

  - id: prob-slau-extra
    kind: problem
    topic: slau
    text: Найдите ФСР однородной системы $\{x_1 - 2x_2 + 3x_3 = 0,\ 2x_1 - 3x_2 + 4x_3 = 0\}$.
    answer: >-
      После $\rw{II} - 2\cdot\rw{I}$: $x_2 = 2x_3$, $x_1 = 2x_2 - 3x_3 = x_3$.
      Ранг $2$, в ФСР один вектор: $\Phi_1 = (1, 2, 1)^T$.

  - id: prob-lu-yes
