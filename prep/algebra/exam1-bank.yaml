    refs: [prob:exam1:complex-roots-filter]

  - id: prob-complex-roots-extra
    kind: problem
    topic: complex-roots
    text: Вычислите $(1 + i)^{10}$ в алгебраической форме.
    answer: >-
      $1 + i = \sqrt2\big(\cos\frac{\pi}{4} + i\sin\frac{\pi}{4}\big)$, по Муавру
      $(\sqrt2)^{10}\big(\cos\frac{5\pi}{2} + i\sin\frac{5\pi}{2}\big) = 32i$.

