  - id: prob-complex-eq-extra
    kind: problem
    topic: complex-eq
    text: Решите уравнение $z^2 - 4z + 13 = 0$ в $\mathbb{C}$.
    answer: 'Дискриминант $D = 16 - 52 = -36 = (6i)^2$; корни $z = \frac{4 \pm 6i}{2} = 2 \pm 3i$.'

