  - id: prob-groups-extra
    kind: problem
    topic: groups
    text: Найдите порядок подстановки $\sigma = (1\;2\;3)(4\;5)$ в $S_5$ и порядок $\bar 4$ в $(\Z_{18}, +)$.
    answer: >-
      $\operatorname{ord} \sigma = \operatorname{lcm}(3, 2) = 6$;
      $\operatorname{ord} \bar 4 = \frac{18}{\text{НОД}(4, 18)} = 9$.
