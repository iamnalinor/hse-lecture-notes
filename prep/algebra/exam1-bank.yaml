    refs: [prob:exam1:vec-tetra]

  - id: prob-vec-extra
    kind: problem
    topic: vectors
    text: >-
      Найдите площадь параллелограмма, построенного на векторах $\vec a = 3\vec p + \vec q$ и
      $\vec b = \vec p - 2\vec q$, если $|\vec p| = 2$, $|\vec q| = 4$, $\angle(\vec p, \vec q) = \frac{\pi}{6}$.
    answer: >-
      $[\vec a, \vec b] = -6[\vec p, \vec q] + [\vec q, \vec p] = -7[\vec p, \vec q]$;
      площадь $S = 7 \cdot 2 \cdot 4 \cdot \sin\frac{\pi}{6} = 28$.

