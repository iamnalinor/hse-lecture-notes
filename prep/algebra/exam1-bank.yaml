      многочлен на неприводимые над $\R$ и над $\mathbb{C}$.
    refs: [prob:exam1:poly-known-root]

  - id: prob-poly-extra
    kind: problem
    topic: poly-factor
    text: Разложите многочлен $x^4 + 64$ на неприводимые множители над $\R$.
    answer: >-
      Дополняем до квадрата: $x^4 + 16x^2 + 64 - 16x^2 = (x^2 + 8)^2 - (4x)^2 = (x^2 - 4x + 8)(x^2 + 4x + 8)$
      (у обоих $D = -16 < 0$).

