  - id: def-vieta3
    kind: definition
    topic: poly-factor
    text: Выпишите формулы Виета для приведённого многочлена третьей степени.
    answer: 'Для кубического многочлена $x^3 + px^2 + qx + r$ с корнями $c_1, c_2, c_3$:'
    refs: [thm:lec12:vieta, eq:lec12:vieta3]

  - id: def-irreducible
    kind: definition
    topic: real-poly
    text: Какие многочлены называются неприводимыми? Какие многочлены неприводимы над $\mathbb{C}$ и над $\R$?
    refs: [def:lec12:irreducible, prop:lec12:irreducible-list]

  - id: def-conjugate-root
    kind: definition
    topic: real-poly
    text: Каким свойством обладают комплексные корни многочлена с вещественными коэффициентами? Приведите пример.
    answer: 'Пример: у $x^2 + 1$ (вещественные коэффициенты) корни $i$ и $-i = \bar i$; у $x^4 + 4$ — пары $1 \pm i$ и $-1 \pm i$.'
    refs: [prop:lec12:conjugate-root]

  - id: def-basis-onb
    kind: definition
    topic: dot-coords
    text: Дайте определения базиса в $V_3$ и ортонормированного базиса (ОНБ). Как выражаются скалярное произведение и длина вектора в ОНБ?
    refs: [def:lec12:basis, def:lec12:onb, cor:lec12:onb]

  - id: def-dot-any-basis
