  - id: def-complex-forms
    kind: definition
    topic: trig-mult
    text: Что такое алгебраическая и тригонометрическая формы записи комплексного числа?
    refs: [def:lec10:algebraic, eq:lec11:trig, def:lec11:trig-form]

  - id: def-mod-arg
    kind: definition
    topic: trig-mult
    text: Дайте определения модуля и аргумента комплексного числа. Что такое главное значение аргумента?
    refs: [def:lec11:modulus, def:lec11:argument, rem:lec11:arg-convention]

  - id: def-trig-mult
    kind: definition
    topic: trig-mult
    text: Сформулируйте правила умножения и деления комплексных чисел в тригонометрической форме.
    refs: [thm:lec11:trig-mult]

  - id: def-moivre
    kind: definition
    topic: moivre
    text: Выпишите формулу Муавра для возведения комплексного числа в целую степень.
    answer: >-
      При $z \ne 0$ формула верна и для всех целых $n \le 0$: $z^0 = 1$,
      $z^{-m} = (z^{-1})^m = r^{-m}\bigl(\cos(-m\varphi) + i\sin(-m\varphi)\bigr)$.
    refs: [thm:lec11:moivre]

  - id: def-roots
    kind: definition
    topic: roots
    text: Дайте определение корня $n$-й степени из комплексного числа, выпишите формулу всех корней и опишите их геометрическое расположение.
    answer: >-
      При $w = 0$ корень единственный: $z = 0$ (аргумент не определён).
      При $w \ne 0$ все $n$ корней лежат на окружности радиуса $\sqrt[n]{\rho}$ с шагом аргумента $\frac{2\pi}{n}$:
      при $n \ge 3$ это вершины правильного $n$-угольника, при $n = 2$ — две противоположные точки $\pm z_0$.
    refs: [def:lec11:root, thm:lec11:roots]

  - id: def-conjugate-division
    kind: definition
    topic: complex-eq
    text: Что такое комплексное сопряжение? Как делить комплексные числа в алгебраической форме?
    refs: [def:lec11:conjugate, prop:lec11:complex-division]

  - id: def-euler
    kind: definition
