    refs: [def:lec14:normal-equation, prop:lec14:point-plane]

  - id: def-maps
    kind: definition
    topic: groups
    text: Дайте определения инъективного, сюръективного и биективного отображений; приведите примеры.
    answer: 'Примеры на $\R \to \R$: $e^x$ — инъекция, не сюръекция; $x^3 - x$ — сюръекция, не инъекция; $x + 1$ — биекция.'
    refs: [def:lec15:injection]

  - id: def-operation-monoid
    kind: definition
    topic: groups
    text: Дайте определения ассоциативной и коммутативной бинарной операции, полугруппы и моноида; приведите примеры.
    answer: 'Примеры: $(\N, +)$ (натуральные с $1$) — полугруппа без нейтрального; $(\Z, \cdot)$ — моноид с нейтральным $1$, не группа.'
    refs: [def:lec15:operation, def:lec15:groupoid, def:lec15:neutral]

  - id: def-group-abelian
    kind: definition
    topic: subgroup-criterion
    text: Дайте определения группы и абелевой группы; приведите примеры абелевой и неабелевой групп.
    answer: 'Примеры: $(\Z, +)$ — абелева группа; $S_3$ и $GL_2(\R)$ — неабелевы группы.'
    refs: [def:lec16:group, def:lec16:abelian]

  - id: def-symmetric-gl-sl
    kind: definition
