      и выведите разложение вещественного многочлена на неприводимые множители над $\R$.
    refs: [prop:lec12:conjugate-root, thm:lec12:real-factorization, rem:exam1:proof-real-poly]

  - id: proof-dot-coords
    kind: proof
    topic: dot-coords
    text: Выведите формулу скалярного произведения векторов в произвольном базисе трёхмерного пространства.
    refs: [def:lec12:gram, thm:lec12:dot-coordinates, rem:exam1:proof-dot-coords]

  - id: proof-cross-coords
    kind: proof
    topic: cross-coords
    text: Выведите формулу векторного произведения в правом ортонормированном базисе.
    refs: [thm:lec13:cross-coords, rem:exam1:proof-cross-coords]

  - id: proof-volume
    kind: proof
    topic: volume
    text: Сформулируйте и докажите теорему о геометрическом смысле смешанного произведения (связь с объёмом).
    refs: [thm:lec13:volume, cor:lec13:coplanar, rem:exam1:proof-volume]

  - id: proof-plane-equation
    kind: proof
    topic: plane-equation
    text: >-
      Докажите, что в ПДСК любая плоскость задаётся линейным уравнением и любое линейное уравнение
      с ненулевым вектором коэффициентов задаёт плоскость.
    refs: [thm:lec14:plane-equation, rem:exam1:proof-plane-equation]

  - id: proof-subgroup-criterion
    kind: proof
