# Банк вопросов генератора вариантов к КР-1 (сайт: /algebra/kr1, раздел «Генератор вариантов»).
# Формат — context/markup.md §11, «Банк билетов». В PDF банк не попадает.
#
# about — подпись генератора: одна короткая фраза, что варианты неофициальные и тренировочные.
# ticket — восемь вопросов, как на КР: определения и формулировки (пара «а) … б) …»), шесть задач —
# по блоку тем на номер, утверждение с доказательством. Баллов нет: они не объявлены.
# questions — id, kind (из ticket), topic (раздел sec:kr1:<topic> страницы), text, refs (блоки-ответы:
# прототипы страницы, формулировки конспектов) и/или answer (ответ и ключевой шаг для новых задач).
# weight — во сколько раз чаще вопрос выпадает (по умолчанию 1): 3 — основные формы задач КР,
# 2 — частые, 1 — редкие. Каждый answer пересчитан (sympy).
# Строки с обратной косой чертой — без кавычек, в '…' или блоком >-; в "…" YAML съест «\».

