  # ------------------------------------------------------------------ дополнительные задачи
  - id: prob-limsup-cos
    kind: problem
    topic: partial
    text: >-
      Для $a_n = (-1)^n\left(1 + \frac1n\right) + \cos\frac{\pi n}{2}$ найдите все частичные пределы,
      $\varlimsup a_n$, $\varliminf a_n$, $\sup a_n$ и $\inf a_n$.
    refs: [prob:colloq1:limsup]
  - id: prob-limsup-sin
    kind: problem
    topic: partial
    text: >-
      Для $x_n = \frac{n}{n+1} \sin\frac{\pi n}{3}$ найдите $\sup x_n$, $\inf x_n$, $\varlimsup x_n$,
      $\varliminf x_n$ и все частичные пределы.
    answer: >-
      При $n \equiv 1, 2, 3, 4, 5, 0 \pmod 6$ синус равен $\frac{\sqrt3}{2}, \frac{\sqrt3}{2}, 0,
      -\frac{\sqrt3}{2}, -\frac{\sqrt3}{2}, 0$, а $\frac{n}{n+1} \to 1$, возрастая. Частичные пределы
      $\frac{\sqrt3}{2}$, $0$, $-\frac{\sqrt3}{2}$; $\varlimsup x_n = \sup x_n = \frac{\sqrt3}{2}$,
      $\varliminf x_n = \inf x_n = -\frac{\sqrt3}{2}$. Точные грани не достигаются: все
      $|x_n| < \frac{\sqrt3}{2}$, а $\frac{n}{n+1} \cdot \frac{\sqrt3}{2}$ сколь угодно близко к
      $\frac{\sqrt3}{2}$.
    refs: [prop:lec06:split]
  - id: prob-limsup-alternating
    kind: problem
    topic: partial
    text: Для $x_n = (-1)^n + \frac1n$ найдите частичные пределы, $\varlimsup x_n$, $\varliminf x_n$, $\sup x_n$, $\inf x_n$. Достигаются ли точные грани?
    answer: >-
      Чётные номера: $x_{2k} = 1 + \frac{1}{2k} \to 1$, убывая; нечётные: $x_{2k-1} = -1 + \frac{1}{2k-1}
      \to -1$, убывая. По утверждению о разбиении номеров частичные пределы $1$ и $-1$:
      $\varlimsup x_n = 1$, $\varliminf x_n = -1$. $\sup x_n = \max x_n = x_2 = \frac32$ (чётные члены
      не больше $x_2$, нечётные $\le 0$). $\inf x_n = -1$ и не достигается: все члены больше $-1$, а
      $x_{2k-1} = -1 + \frac{1}{2k-1}$ сколь угодно близки к $-1$.
    refs: [prop:lec06:split, prop:lec05:sup-eps]
  - id: prob-limsup-cos3
    kind: problem
    topic: partial
    text: Для $x_n = \left(1 + \frac1n\right)\cos\frac{2\pi n}{3}$ найдите частичные пределы, $\varlimsup x_n$, $\varliminf x_n$, $\sup x_n$, $\inf x_n$.
    answer: >-
      $\cos\frac{2\pi n}{3}$ равен $1$ при $n = 3m$ и $-\frac12$ при остальных $n$. Подпоследовательность
      $n = 3m$ стремится к $1$, остальные члены — к $-\frac12$; частичные пределы $1$ и $-\frac12$,
      $\varlimsup x_n = 1$, $\varliminf x_n = -\frac12$. Члены с $n = 3m$ равны $1 + \frac{1}{3m}$ и
      убывают, остальные отрицательны, поэтому $\sup x_n = \max x_n = x_3 = \frac43$. Члены с $n \ne 3m$
      равны $-\frac12\left(1 + \frac1n\right)$ и возрастают с ростом $n$, поэтому
      $\inf x_n = \min x_n = x_1 = -1$.
    refs: [prop:lec06:split]
  - id: prob-limsup-sum
    kind: problem
    topic: partial
    text: >-
      Пусть $(a_n)$ и $(b_n)$ ограничены. Докажите, что $\varlimsup (a_n + b_n) \le \varlimsup a_n +
      \varlimsup b_n$, и приведите пример, где неравенство строгое.
    answer: >-
      Пусть $L = \varlimsup(a_n + b_n)$ — частичный предел: $a_{n_k} + b_{n_k} \to L$. По теореме
      Больцано–Вейерштрасса у ограниченной $(a_{n_k})$ есть сходящаяся подпоследовательность
      $a_{n_{k_j}} \to \alpha$; тогда $b_{n_{k_j}} = (a_{n_{k_j}} + b_{n_{k_j}}) - a_{n_{k_j}} \to L - \alpha
      =: \beta$. Числа $\alpha$ и $\beta$ — частичные пределы $(a_n)$ и $(b_n)$, поэтому
      $\alpha \le \varlimsup a_n$, $\beta \le \varlimsup b_n$ и $L = \alpha + \beta \le \varlimsup a_n +
      \varlimsup b_n$. Пример: $a_n = (-1)^n$, $b_n = (-1)^{n+1}$: слева $0$, справа $2$.
    refs: [def:lec06:limsup, thm:lec06:bw]
  - id: prob-blocks
    kind: problem
    topic: partial
    text: >-
      Найдите множество частичных пределов, верхний и нижний пределы последовательности, $k$-й блок
      которой ($k = 1, 2, \dots$) — числа $\frac{1}{2^k}, \frac{2}{2^k}, \dots, \frac{2^k}{2^k}, 3 + \frac1k$. В ответе это пункт (a) задачи.
    refs: [prob:lec06:blocks]
  - id: prob-sup-set
    kind: problem
    topic: sup
    text: Найдите $\sup$ и $\inf$ множества $\left\{\frac{m - n}{m + n} \;\middle|\; m, n \in \N\right\}$. Достигаются ли они?
    refs: [prob:colloq1:sup-set]
  - id: prob-sup-fraction
    kind: problem
    topic: sup
    text: Найдите $\sup$ и $\inf$ множества $\left\{\frac{n}{n^2 + 4} \;\middle|\; n \in \N\right\}$. Достигаются ли они?
    answer: >-
      $\sup = \max = \frac14$ (при $n = 2$): $\frac{n}{n^2 + 4} \le \frac14 \Leftrightarrow (n - 2)^2 \ge 0$.
      $\inf = 0$ и не достигается: все элементы положительны, а $\frac{n}{n^2 + 4} < \frac1n < \varepsilon$
      при $n > \frac1\varepsilon$, то есть для любого $\varepsilon > 0$ есть элемент меньше $0 + \varepsilon$.
    refs: [prop:lec05:sup-eps, prop:lec05:max]
  - id: prob-sup-parabola
    kind: problem
    topic: sup
    text: Найдите $\sup$ и $\inf$ множества $\{x^2 - 2x \mid x \in (0; 3)\}$. Достигаются ли они?
    answer: >-
      $x^2 - 2x = (x - 1)^2 - 1$. $\inf = \min = -1$ (при $x = 1$). $\sup = 3$ и не достигается: при
      $x \in (0; 3)$ имеем $|x - 1| < 2$, поэтому $x^2 - 2x < 3$; при $x = 3 - t$, $0 < t < 1$, значение
      равно $3 - 4t + t^2 > 3 - 4t$, и это больше $3 - \varepsilon$ при $t < \frac\varepsilon4$.
    refs: [prop:lec05:sup-eps]
  - id: prob-sup-sets
    kind: problem
    topic: sup
    text: >-
      Найдите $\sup$ и $\inf$ множеств и выясните, достигаются ли они: $\left\{\frac{3 + (-1)^n}{n} \mid n \in
      \N\right\}$ и $\left\{\frac{n}{2n + m} \mid m, n \in \N\right\}$. В ответе это пункты (a) и (b) задачи.
    refs: [prob:lec05:sup-sets]
  - id: prob-recurrent-sqrt
    kind: problem
    topic: weierstrass
    text: Докажите, что последовательность $x_1 = 1$, $x_{n+1} = \sqrt{2 + x_n}$ сходится, и найдите её предел.
    refs: [prob:colloq1:recurrent]
  - id: prob-recurrent-heron
    kind: problem
    topic: weierstrass
    text: Докажите, что последовательность $x_1 = 3$, $x_{n+1} = \frac{x_n}{2} + \frac{2}{x_n}$ сходится, и найдите её предел.
    answer: >-
      Предел $2$. Все $x_n > 0$ (индукция). $x_{n+1} - 2 = \frac{x_n^2 - 4x_n + 4}{2x_n} = \frac{(x_n - 2)^2}{2x_n}
      \ge 0$, то есть $x_n \ge 2$ при всех $n$ ($x_1 = 3$). Тогда $x_{n+1} - x_n = \frac{4 - x_n^2}{2x_n} \le 0$:
      последовательность не возрастает и ограничена снизу числом $2$, по теореме Вейерштрасса $x_n \to L \ge 2$.
      Переход к пределу в $2x_{n+1}x_n = x_n^2 + 4$ даёт $L^2 = 4$, $L = 2$.
    refs: [thm:lec05:weierstrass, rem:lec05:recurrent-trap]
  - id: prob-root-sum
    kind: problem
    topic: squeeze
    text: Найдите $\lim\limits_{n \to \infty} \sqrt[n]{2^n + 3^n}$.
    refs: [prob:colloq1:root-sum]
  - id: prob-e-shift
    kind: problem
    topic: e
    text: Найдите $\lim\left(1 + \frac1n\right)^{n+5}$ и $\lim\left(1 + \frac{1}{n+2}\right)^{n}$.
    answer: >-
      Оба предела равны $e$. Первый: $\left(1 + \frac1n\right)^{n+5} = \left(1 + \frac1n\right)^n \cdot
      \left(1 + \frac1n\right)^5 \to e \cdot 1$ по арифметике предела. Второй:
      $\left(1 + \frac{1}{n+2}\right)^n = \left(1 + \frac{1}{n+2}\right)^{n+2} \Big/ \left(1 + \frac{1}{n+2}\right)^2$;
      числитель — сдвиг последовательности $\left(1 + \frac1n\right)^n$ на два номера и стремится к $e$,
      знаменатель стремится к $1$.
    refs: [thm:lec05:e, prop:lec03:finite-change]
  - id: prob-cauchy-geometric
    kind: problem
    topic: cauchy
    text: >-
      Пусть $0 < q < 1$ и $|a_{n+1} - a_n| \le q^n$ при всех $n$. Докажите, что $(a_n)$ сходится. Верно ли то
      же при условии $|a_{n+1} - a_n| \le \frac1n$?
    refs: [prob:colloq1:cauchy-geometric]
  - id: prob-delta-square
    kind: problem
    topic: function-limit
    text: Докажите по определению Коши, что $\lim\limits_{x \to 1} (x^2 + x) = 2$.
    refs: [prob:colloq1:cauchy-delta]
  - id: prob-delta-root
    kind: problem
    topic: function-limit
    text: Докажите по определению Коши, что $\lim\limits_{x \to 4} \sqrt x = 2$.
    answer: >-
      Годится $\delta(\varepsilon) = \min(4, 2\varepsilon)$. При $|x - 4| < 4$ имеем $x > 0$, и
      $|\sqrt x - 2| = \frac{|x - 4|}{\sqrt x + 2} \le \frac{|x - 4|}{2} < \varepsilon$ при $|x - 4| < 2\varepsilon$.
    refs: [def:lec07:cauchy-limit]
  - id: prob-no-limit
    kind: problem
    topic: function-limit
    text: Докажите, что у $f(x) = \cos\frac1x$ нет предела при $x \to 0$.
    refs: [prob:colloq1:no-limit]
  - id: prob-composite
    kind: problem
    topic: function-props
    text: >-
      Пусть $g(y) = y^2$ при $y \ne 1$ и $g(1) = 5$. Найдите $\lim\limits_{x \to 0} g(1 + x^2)$. Какое условие
      теоремы о пределе сложной функции здесь работает, а какое нарушено?
    refs: [prob:colloq1:composite]
