# Банк вопросов генератора билетов к коллоквиуму 1 (сайт: /calculus/colloq1, раздел «Пробный билет»).
# Формат — context/markup.md §11, «Банк билетов». В PDF банк не попадает.
#
# ticket — пункты билета по порядку: вид вопроса, как он называется в билете, баллы, сколько вопросов
# этого вида в билете, proofs: true — в ответе нужны доказательства (сайт показывает ::: proof блоков
# конспекта, линтер требует доказательство у каждого вопроса). Поменять формат билета — только здесь.
# questions — вопросы: id, kind (из ticket), topic (раздел sec:colloq1:<topic> страницы — «к разделу»
# и разные темы в одном билете), text (Markdown, формулы $…$), refs (метки блоков-ответов: конспекты
# или эта страница) и/или answer (свой короткий ответ — только если готового блока нет).
# Строки с обратной косой чертой — без кавычек, в '…' или блоком >-; в "…" YAML съест «\».

ticket:
  - kind: proof
    title: Теорема с доказательством
    points: 2 балла
    count: 2
    proofs: true
  - kind: claim
    title: Докажите утверждение
    points: 1 балл
    count: 1
    proofs: true
  - kind: disprove
    title: 'Докажите или опровергните; если неверно — контрпример, исправленная формулировка и её доказательство'
    points: 1 балл
    count: 1
    proofs: true
  - kind: definition
    title: Вопрос на формулировку
    points: 0,5 балла
    count: 4
  - kind: problem
    title: Дополнительная задача
    points: для набравших 7–8 баллов, 20 минут
    count: 1

questions:
  # ------------------------------------------------------------------ теоремы с доказательством
  - id: proof-negation
    kind: proof
    topic: logic
    text: Правило обращения кванторов (отрицание высказываний с $\forall$ и $\exists$).
    refs: [thm:lec01:negation]
  - id: proof-bernoulli
    kind: proof
    topic: induction
    text: Неравенство Бернулли.
    refs: [thm:lec01:bernoulli, rem:colloq1:proof-bernoulli]
  - id: proof-sqrt2
    kind: proof
    topic: induction
    text: Иррациональность числа $\sqrt2$ (доказательство от противного).
    refs: [rem:colloq1:proof-sqrt2]
  - id: proof-counting
    kind: proof
    topic: binomial
    text: Формулы для числа перестановок $P_n$, размещений $A_n^k$ и сочетаний $C_n^k$.
    refs: [prop:lec02:permutations, prop:lec02:arrangements, prop:lec02:combinations, rem:colloq1:proof-counting]
  - id: proof-binomial
    kind: proof
    topic: binomial
    text: Бином Ньютона.
    refs: [thm:lec02:binomial, rem:colloq1:proof-binomial]
  - id: proof-pascal
    kind: proof
    topic: binomial
    text: Свойства чисел сочетаний $C_n^k = C_n^{n-k}$ и $C_n^k = C_{n-1}^k + C_{n-1}^{k-1}$ (правило Паскаля).
    refs: [prop:lec02:pascal, rem:colloq1:proof-pascal]
  - id: proof-uniqueness
    kind: proof
    topic: limit
    text: Единственность предела последовательности.
    refs: [thm:lec03:uniqueness, rem:colloq1:proof-uniqueness]
  - id: proof-bounded
    kind: proof
    topic: limit
    text: Сходящаяся последовательность ограничена.
    refs: [thm:lec03:bounded, rem:colloq1:proof-bounded]
  - id: proof-separated
    kind: proof
    topic: limit
    text: Последовательность с ненулевыми членами, сходящаяся к ненулевому числу, отделима от нуля.
    refs: [prop:lec04:separated, rem:colloq1:proof-separated]
  - id: proof-sum
    kind: proof
    topic: arithmetic
    text: Предел суммы и разности сходящихся последовательностей.
    refs: [thm:lec03:sum, rem:colloq1:proof-sum]
  - id: proof-product
    kind: proof
    topic: arithmetic
    text: Предел произведения сходящихся последовательностей.
    refs: [thm:lec04:product, rem:colloq1:proof-product]
  - id: proof-quotient
    kind: proof
    topic: arithmetic
    text: Предел частного сходящихся последовательностей.
    refs: [thm:lec04:quotient, rem:colloq1:proof-quotient]
  - id: proof-inequality
    kind: proof
    topic: squeeze
    text: Предельный переход в неравенстве для последовательностей.
    refs: [thm:lec04:inequality, rem:colloq1:proof-inequality]
  - id: proof-squeeze
    kind: proof
    topic: squeeze
    text: Теорема о двух милиционерах для последовательностей.
    refs: [thm:lec04:squeeze, rem:colloq1:proof-squeeze]
  - id: proof-sup-exists
    kind: proof
    topic: sup
    text: Существование точной верхней (и нижней) грани у непустого ограниченного сверху (снизу) множества.
    refs: [thm:lec05:sup-exists, rem:colloq1:proof-sup]
  - id: proof-sup-eps
    kind: proof
    topic: sup
    text: Характеризация точной верхней грани через $\varepsilon$.
    refs: [prop:lec05:sup-eps, rem:colloq1:proof-sup-eps]
  - id: proof-weierstrass
    kind: proof
    topic: weierstrass
    text: Теорема Вейерштрасса о монотонной ограниченной последовательности.
    refs: [thm:lec05:weierstrass, rem:colloq1:proof-weierstrass]
  - id: proof-e
    kind: proof
    topic: e
    text: Сходимость последовательности $\left(1 + \frac1n\right)^n$.
    refs: [thm:lec05:e, rem:colloq1:proof-e]
  - id: proof-bw
    kind: proof
    topic: bw
    text: Теорема Больцано–Вейерштрасса.
    refs: [thm:lec06:bw, rem:colloq1:proof-bw]
  - id: proof-partial-limit-point
    kind: proof
    topic: partial
    text: Число $a$ — частичный предел последовательности тогда и только тогда, когда $a$ — её предельная точка.
    refs: [thm:lec06:partial-limit-point, rem:colloq1:proof-partial]
  - id: proof-one-limit
    kind: proof
    topic: partial
    text: >-
      Ограниченная последовательность сходится тогда и только тогда, когда у неё ровно один частичный
      предел (то есть $\varlimsup a_n = \varliminf a_n$).
    refs: [rem:colloq1:proof-one-limit, prob:lec06:one-limit-point]
  - id: proof-cauchy
    kind: proof
    topic: cauchy
    text: Критерий Коши сходимости последовательности.
    refs: [thm:lec06:cauchy, rem:colloq1:proof-cauchy, rem:colloq1:proof-fundamental-bounded]
  - id: proof-cauchy-heine
    kind: proof
    topic: function-limit
    text: Равносильность определений предела функции по Коши и по Гейне.
    refs: [thm:lec07:cauchy-heine, rem:colloq1:proof-cauchy-heine]
  - id: proof-function-arithmetic
    kind: proof
    topic: function-props
    text: Арифметика предела функции (сумма, произведение, частное).
    refs: [thm:lec07:arithmetic, rem:colloq1:proof-function-props]
  - id: proof-function-inequalities
    kind: proof
    topic: function-props
    text: Предельный переход в неравенстве и теорема о двух милиционерах для функций.
    refs: [thm:lec07:inequalities, rem:colloq1:proof-function-props]
  - id: proof-composite
    kind: proof
    topic: function-props
    text: Теорема о пределе сложной функции.
    refs: [thm:lec07:composite, rem:colloq1:proof-function-props]

  # ------------------------------------------------------------------ короткие утверждения (пункт «а»)
  - id: claim-quantifier-order
    kind: claim
    topic: logic
    text: >-
      Докажите, что из $\exists y\ \forall x\colon P(x, y)$ следует $\forall x\ \exists y\colon P(x, y)$, и
      приведите пример, где обратное неверно.
    refs: [prop:lec01:order]
  - id: claim-contrapositive
    kind: claim
    topic: logic
    text: Докажите, что $A \Rightarrow B$ равносильно $\lnot B \Rightarrow \lnot A$ и $\lnot(A \Rightarrow B)$ равносильно $A \wedge \lnot B$.
    refs: [prop:lec01:laws, ex:lec01:contrapositive]
  - id: claim-sum-n
    kind: claim
    topic: induction
    text: Докажите по индукции, что $1 + 2 + \dots + n = \frac{n(n+1)}{2}$ при всех $n \in \N$.
    refs: [prop:lec01:sum]
  - id: claim-binomial-sum
    kind: claim
    topic: binomial
    text: Докажите, что $\sum\limits_{k=0}^{n} C_n^k = 2^n$ и $\sum\limits_{k=0}^{n} (-1)^k C_n^k = 0$.
    refs: [cor:lec02:sum]
  - id: claim-bounded-abs
    kind: claim
    topic: limit
    text: Докажите, что последовательность ограничена тогда и только тогда, когда $\exists C > 0\ \forall n\colon |a_n| < C$.
    refs: [prop:lec02:bounded-abs]
  - id: claim-large-times-separated
    kind: claim
    topic: limit
    text: Докажите, что произведение бесконечно большой последовательности и последовательности, отделимой от нуля, — бесконечно большая.
    answer: >-
      Пусть $|d_n| > \delta > 0$ при всех $n$ и $a_n \to \infty$. Для $M > 0$ возьмём номер $N$ из
      определения б.б. для уровня $\frac M\delta$: $|a_n| > \frac M\delta$ при $n > N$. Тогда при $n > N$
      $$|a_n d_n| = |a_n|\,|d_n| > \frac M\delta \cdot \delta = M.$$
    refs: [def:lec04:infinite-limit, def:lec04:separated]
  - id: claim-bounded-small
    kind: claim
    topic: limit
    text: Докажите, что произведение ограниченной последовательности на бесконечно малую — бесконечно малая.
    refs: [prop:lec04:bounded-small, rem:colloq1:proof-small]
  - id: claim-reciprocal
    kind: claim
    topic: limit
    text: Докажите, что $\frac{1}{a_n}$ — бесконечно малая, если $(a_n)$ бесконечно большая, и бесконечно большая, если $(a_n)$ бесконечно малая (при $a_n \ne 0$).
    refs: [prop:lec04:reciprocal, rem:colloq1:proof-small]
  - id: claim-reciprocal-bounded
    kind: claim
    topic: limit
    text: Докажите, что $\frac{1}{d_n}$ ограничена, если $(d_n)$ отделима от нуля, и отделима от нуля, если $(d_n)$ ограничена и $d_n \ne 0$.
    refs: [prop:lec04:reciprocal-bounded]
  - id: claim-small-algebra
    kind: claim
    topic: limit
    text: Докажите, что сумма двух бесконечно малых — бесконечно малая и что бесконечно малая ограничена.
    refs: [cor:lec04:small-algebra]
  - id: claim-finite-change
    kind: claim
    topic: limit
    text: Докажите, что изменение (или отбрасывание) конечного числа членов не влияет на сходимость и предел последовательности.
    refs: [prop:lec03:finite-change]
  - id: claim-triangle
    kind: claim
    topic: arithmetic
    text: Докажите неравенство треугольника $|x + y| \le |x| + |y|$ и выведите из него $\bigl||x| - |y|\bigr| \le |x - y|$.
    answer: >-
      Второе: $|x| = |(x - y) + y| \le |x - y| + |y|$, то есть $|x| - |y| \le |x - y|$; поменяв $x$ и $y$
      ролями, получаем $|y| - |x| \le |x - y|$. Вместе это и есть $\bigl||x| - |y|\bigr| \le |x - y|$.
    refs: [prop:lec03:triangle]
  - id: claim-decomposition
    kind: claim
    topic: arithmetic
    text: Докажите, что $a_n \to a$ тогда и только тогда, когда $a_n = a + \alpha_n$, где $(\alpha_n)$ — бесконечно малая.
    refs: [lem:lec04:decomposition]
  - id: claim-bound-limit
    kind: claim
    topic: squeeze
    text: Докажите, что если $a_n \to a$ и $a_n \le C$ начиная с некоторого номера, то $a \le C$.
    refs: [cor:lec04:bound-limit, thm:lec04:inequality]
  - id: claim-sup-max
    kind: claim
    topic: sup
    text: Докажите, что если у множества есть наибольший элемент, то он совпадает с точной верхней гранью.
    refs: [prop:lec05:max]
  - id: claim-inf-exists
    kind: claim
    topic: sup
    text: Докажите, что у непустого ограниченного снизу множества $A$ есть $\inf A$ и $\inf A = -\sup(-A)$.
    refs: [cor:lec05:inf-exists]
  - id: claim-sup-sum
    kind: claim
    topic: sup
    text: Докажите, что $\sup(A + B) = \sup A + \sup B$ для непустых ограниченных сверху $A, B \subseteq \R$.
    refs: [prob:colloq1:sup-sum]
  - id: claim-weierstrass-dec
    kind: claim
    topic: weierstrass
    text: Докажите, что невозрастающая ограниченная снизу последовательность сходится к $\inf a_n$.
    refs: [cor:lec05:weierstrass-dec]
  - id: claim-monotone-infinite
    kind: claim
    topic: weierstrass
    text: Докажите, что неубывающая неограниченная сверху последовательность стремится к $+\infty$.
    refs: [prop:lec05:monotone-infinite]
  - id: claim-e-bounds
    kind: claim
    topic: e
    text: Докажите, что $\left(1 + \frac1n\right)^n < e \le 3$ при всех $n \in \N$.
    answer: >-
      По теореме о числе $e$ последовательность $a_n = \left(1 + \frac1n\right)^n$ строго возрастает и
      $a_n < 3$. По теореме Вейерштрасса $e = \lim a_n = \sup a_n$, поэтому $a_n < a_{n+1} \le e$. Из
      $a_n < 3$ предельным переходом получаем $e \le 3$ — только нестрогое неравенство.
    refs: [thm:lec05:e, cor:lec04:bound-limit]
  - id: claim-nk
    kind: claim
    topic: bw
    text: Докажите, что номера подпоследовательности удовлетворяют $n_k \ge k$.
    refs: [lem:lec05:nk]
  - id: claim-divergence
    kind: claim
    topic: bw
    text: >-
      Докажите, что последовательность с двумя подпоследовательностями, имеющими разные пределы, расходится
      (можно пользоваться тем, что подпоследовательность сходящейся сходится к тому же пределу).
    refs: [cor:lec05:divergence, prop:lec05:subseq-limit]
  - id: claim-unbounded-subseq
    kind: claim
    topic: bw
    text: Докажите, что у неограниченной сверху последовательности есть подпоследовательность, стремящаяся к $+\infty$.
    refs: [prop:lec06:unbounded-subseq]
  - id: claim-limsup-sup
    kind: claim
    topic: partial
    text: Докажите, что для ограниченной последовательности $\inf a_n \le \varliminf a_n \le \varlimsup a_n \le \sup a_n$.
    refs: [prop:lec06:limsup-sup]
  - id: claim-fundamental-bounded
    kind: claim
    topic: cauchy
    text: Докажите, что фундаментальная последовательность ограничена.
    refs: [lem:lec06:fundamental-bounded, rem:colloq1:proof-fundamental-bounded]
  - id: claim-function-uniqueness
    kind: claim
    topic: function-limit
    text: Докажите единственность предела функции в точке.
    refs: [cor:lec07:uniqueness]
  - id: claim-two-sequences
    kind: claim
    topic: function-limit
    text: >-
      Докажите: если для двух последовательностей Гейне $(x_n)$ и $(y_n)$ в точке $x_0$ пределы $f(x_n)$ и
      $f(y_n)$ различны, то у $f$ нет предела в точке $x_0$.
    answer: >-
      Если бы $\lim\limits_{x \to x_0} f(x) = L$, то по определению Гейне $f(x_n) \to L$ и $f(y_n) \to L$,
      и по единственности предела последовательности оба предела равнялись бы $L$ — противоречие.
    refs: [cor:lec07:two-sequences, def:lec07:heine-limit]
  - id: claim-abs-limit
    kind: claim
    topic: function-props
    text: Докажите, что если $\lim\limits_{x \to x_0} f(x) = A$, то $\lim\limits_{x \to x_0} |f(x)| = |A|$. Верно ли обратное?
    answer: >-
      $\bigl||f(x)| - |A|\bigr| \le |f(x) - A|$ (следствие неравенства треугольника), поэтому то же
      $\delta(\varepsilon)$, что для $f$, годится и для $|f|$. Обратное неверно: $f(x) = 1$ при $x \ge 0$ и
      $f(x) = -1$ при $x < 0$; $|f| \equiv 1$, а у $f$ в нуле предела нет (на $\frac1n$ значения $1$, на
      $-\frac1n$ — значения $-1$). Обратное верно при $A = 0$: $|f(x)| \to 0 \Leftrightarrow f(x) \to 0$.
    refs: [prop:lec03:triangle, def:lec07:cauchy-limit]

  # ------------------------------------------------------------------ докажите или опровергните (пункт «б»)
  - id: dis-quantifier-order
    kind: disprove
    topic: logic
    text: Из $\forall x\ \exists y\colon P(x, y)$ следует $\exists y\ \forall x\colon P(x, y)$.
    answer: >-
      Неверно: $\forall x \in \R\ \exists y \in \R\colon y > x$ истинно ($y = x + 1$), а
      $\exists y\ \forall x\colon y > x$ ложно — нет числа больше всех. Верно обратное следствие: из
      $\exists y\ \forall x$ следует $\forall x\ \exists y$ — годится то же $y_0$ для всех $x$.
    refs: [prop:lec01:order]
  - id: dis-bernoulli
    kind: disprove
    topic: induction
    text: $(1 + x)^n \ge 1 + nx$ при всех $n \in \N$ и всех $x \in \R$.
    answer: >-
      Неверно: при $n = 3$, $x = -4$ слева $-27$, справа $-11$. Верно при $x \ge -1$ (неравенство
      Бернулли): условие нужно в шаге индукции при умножении на $1 + x \ge 0$.
    refs: [rem:lec01:bernoulli-condition, thm:lec01:bernoulli, rem:colloq1:proof-bernoulli]
  - id: dis-small-times-large
    kind: disprove
    topic: limit
    text: Произведение бесконечно малой и бесконечно большой последовательностей — бесконечно малая.
    answer: >-
      Неверно: $\frac1n \cdot n = 1$, $\frac1n \cdot n^2 = n$. Верно, если бесконечно большой множитель
      заменить ограниченным: пусть $\alpha_n \to 0$ и $|c_n| < C$; тогда $|\alpha_n c_n| \le C|\alpha_n| <
      \varepsilon$ при $n > N\left(\frac\varepsilon C\right)$, где $N(\cdot)$ — номер из определения
      $\alpha_n \to 0$.
    refs: [prop:lec04:bounded-small]
  - id: dis-product-small
    kind: disprove
    topic: limit
    text: Если $a_n b_n \to 0$, то $a_n \to 0$ или $b_n \to 0$.
    refs: [prob:colloq1:product-small]
  - id: dis-plus-infinity
    kind: disprove
    topic: limit
    text: Если $x_n \to +\infty$, а $(y_n)$ ограничена сверху, то $x_n + y_n \to +\infty$.
    answer: >-
      Неверно: $x_n = n$, $y_n = -n$, сумма равна $0$. Верно, если $(y_n)$ ограничена снизу.
    refs: [prob:colloq1:plus-infinity]
  - id: dis-divergent-sum
    kind: disprove
    topic: arithmetic
    text: Сумма двух расходящихся последовательностей расходится.
    answer: >-
      Неверно: $(-1)^n + (-1)^{n+1} = 0$. Верно: сумма сходящейся и расходящейся последовательностей
      расходится. Если $a_n$ сходится, $b_n$ расходится, а $a_n + b_n$ сходится, то
      $b_n = (a_n + b_n) - a_n$ сходится как разность сходящихся — противоречие.
    refs: [rem:lec03:sum-backwards, thm:lec03:sum]
  - id: dis-product-convergent
    kind: disprove
    topic: arithmetic
    text: Если $(a_n)$ и $(a_n b_n)$ сходятся, то $(b_n)$ сходится.
    answer: >-
      Неверно: $a_n = \frac1n$, $b_n = (-1)^n$; $a_n b_n \to 0$, а $(b_n)$ расходится. Верно, если
      $a_n \to a \ne 0$ и $a_n \ne 0$ при всех $n$: тогда $b_n = \frac{a_n b_n}{a_n}$ сходится по теореме
      о пределе частного.
    refs: [thm:lec04:quotient]
  - id: dis-strict-inequality
    kind: disprove
    topic: squeeze
    text: Если $a_n \to a$, $b_n \to b$ и $a_n > b_n$ при всех $n$, то $a > b$.
    answer: >-
      Неверно: $\frac1n > 0$, но оба предела равны $0$. Верно нестрогое: $a \ge b$ (предельный переход
      в неравенстве).
    refs: [rem:lec04:strict, thm:lec04:inequality, rem:colloq1:proof-inequality]
  - id: dis-squeeze-limits
    kind: disprove
    topic: squeeze
    text: Если $a_n \le b_n \le c_n$ при всех $n$ и $(a_n)$, $(c_n)$ сходятся, то $(b_n)$ сходится.
    answer: >-
      Неверно: $-1 \le (-1)^n \le 1$. Верно, если $(a_n)$ и $(c_n)$ сходятся к одному и тому же числу
      (теорема о двух милиционерах).
    refs: [rem:lec04:squeeze-limits, thm:lec04:squeeze, rem:colloq1:proof-squeeze]
  - id: dis-max
    kind: disprove
    topic: sup
    text: У непустого ограниченного сверху множества есть наибольший элемент.
    answer: >-
      Неверно: у $(0; 1)$ наибольшего элемента нет. Верно: у непустого ограниченного сверху множества
      есть точная верхняя грань (у $(0; 1)$ она равна $1$ и множеству не принадлежит).
    refs: [rem:lec05:sup-not-max, thm:lec05:sup-exists, rem:colloq1:proof-sup]
  - id: dis-sup-subset
    kind: disprove
    topic: sup
    text: Если $A \subsetneq B$ — непустые ограниченные сверху множества, то $\sup A < \sup B$.
    answer: >-
      Неверно: $A = (0; 1)$, $B = (0; 1]$, у обоих супремум $1$. Верно нестрогое $\sup A \le \sup B$:
      $\sup B$ не меньше всех элементов $B$, в том числе всех элементов $A$, то есть это верхняя грань
      $A$, а $\sup A$ — наименьшая из верхних граней.
    refs: [def:lec05:sup]
  - id: dis-monotone
    kind: disprove
    topic: weierstrass
    text: Монотонная последовательность сходится.
    answer: >-
      Неверно: $a_n = n$. Верно: монотонная *ограниченная* последовательность сходится (теорема
      Вейерштрасса); монотонная последовательность сходится тогда и только тогда, когда она ограничена.
    refs: [thm:lec05:weierstrass, rem:colloq1:proof-weierstrass, prop:lec05:monotone-infinite]
  - id: dis-bounded-converges
    kind: disprove
    topic: bw
    text: Ограниченная последовательность сходится.
    answer: >-
      Неверно: $(-1)^n$. Верно: у ограниченной последовательности есть сходящаяся подпоследовательность
      (теорема Больцано–Вейерштрасса); ограниченная монотонная последовательность сходится.
    refs: [rem:lec03:bounded-not-convergent, thm:lec06:bw, rem:colloq1:proof-bw]
  - id: dis-even-odd
    kind: disprove
    topic: bw
    text: Если подпоследовательности $(a_{2k})$ и $(a_{2k-1})$ сходятся, то $(a_n)$ сходится.
    answer: >-
      Неверно: $(-1)^n$ — у неё $a_{2k} \to 1$, $a_{2k-1} \to -1$. Верно, если обе подпоследовательности
      сходятся к *одному* числу $a$: для $\varepsilon > 0$ возьмём $K_1$, $K_2$, после которых
      $|a_{2k} - a| < \varepsilon$ и $|a_{2k-1} - a| < \varepsilon$; при $n > \max(2K_1, 2K_2)$ член $a_n$ —
      это $a_{2k}$ или $a_{2k-1}$ с $k > K_1$ или $k > K_2$ соответственно, и $|a_n - a| < \varepsilon$.
    refs: [prob:lec05:even-odd]
  - id: dis-unbounded-infinite
    kind: disprove
    topic: bw
    text: Неограниченная последовательность бесконечно большая.
    answer: >-
      Неверно: $a_n = n^{(-1)^n}$ ($1, 2, \frac13, 4, \dots$) не ограничена, но $|a_n| \le 1$ при всех
      нечётных $n$. Верно: у неограниченной сверху последовательности есть подпоследовательность,
      стремящаяся к $+\infty$.
    refs: [rem:lec04:unbounded-not-large, prop:lec06:unbounded-subseq]
  - id: dis-sup-partial
    kind: disprove
    topic: partial
    text: Точная верхняя грань $\sup a_n$ ограниченной последовательности — её частичный предел.
    answer: >-
      Неверно: у $100, 0, 0, \dots$ супремум $100$, а единственный частичный предел $0$. Верно, если
      супремум $M$ не достигается ($a_n \ne M$ при всех $n$): тогда в каждом интервале $(M - \varepsilon; M)$
      бесконечно много членов, $M$ — предельная точка, то есть частичный предел, и $\varlimsup a_n = M$.
    refs: [rem:colloq1:limsup-not-sup]
  - id: dis-one-partial
    kind: disprove
    topic: partial
    text: Если у последовательности ровно один конечный частичный предел, то она сходится.
    answer: >-
      Неверно: $0, 2, 0, 4, 0, 6, \dots$ (нули на нечётных местах, $a_{2k} = 2k$): конечный частичный
      предел один — $0$, а последовательность не ограничена и расходится. Верно для *ограниченной*
      последовательности.
    refs: [prob:lec06:one-limit-point, rem:colloq1:proof-one-limit]
  - id: dis-neighbors
    kind: disprove
    topic: cauchy
    text: Если $a_{n+1} - a_n \to 0$, то $(a_n)$ сходится.
    answer: >-
      Неверно: $\sqrt{n+1} - \sqrt n \to 0$, а $\sqrt n \to +\infty$. Верно, например, если
      $|a_{n+1} - a_n| \le q^n$ при некотором $0 < q < 1$: тогда последовательность фундаментальна.
    refs: [rem:colloq1:neighbors-trap, prob:colloq1:cauchy-geometric]
  - id: dis-fixed-p
    kind: disprove
    topic: cauchy
    text: Если $a_{n+p} - a_n \to 0$ при $n \to \infty$ для каждого фиксированного $p \in \N$, то $(a_n)$ фундаментальна.
    answer: >-
      Неверно: $H_n = 1 + \frac12 + \dots + \frac1n$. При фиксированном $p$
      $0 < H_{n+p} - H_n \le \frac{p}{n+1} \to 0$, но $H_{2n} - H_n \ge \frac12$, и $(H_n)$ расходится.
      Верно, если номер не зависит от $p$: $\forall \varepsilon > 0\ \exists N\ \forall n > N\ \forall p \in \N\colon
      |a_{n+p} - a_n| < \varepsilon$ — это и есть фундаментальность ($m = n + p$).
    refs: [def:lec06:fundamental, ex:lec06:harmonic]
  - id: dis-one-sequence
    kind: disprove
    topic: function-limit
    text: >-
      Если нашлась последовательность $x_n \to x_0$, $x_n \ne x_0$, для которой $f(x_n) \to A$, то
      $\lim\limits_{x \to x_0} f(x) = A$.
    answer: >-
      Неверно: у $\sin\frac\pi x$ на $x_n = \frac1n$ все значения равны $0$, а предела в нуле нет. Верно,
      если $f(x_n) \to A$ для *любой* такой последовательности — это определение по Гейне.
    refs: [rem:lec07:one-sequence, def:lec07:heine-limit]
  - id: dis-function-strict
    kind: disprove
    topic: function-props
    text: >-
      Если $f(x) > g(x)$ в проколотой окрестности $x_0$, $f(x) \to A$ и $g(x) \to B$ при $x \to x_0$, то
      $A > B$.
    answer: >-
      Неверно: $x^2 > 0$ при $x \ne 0$, но оба предела в нуле равны $0$. Верно нестрогое $A \ge B$.
    refs: [rem:lec07:strict, thm:lec07:inequalities]
  - id: dis-composite
    kind: disprove
    topic: function-props
    text: >-
      Если $\lim\limits_{x \to x_0} f(x) = A$ и $\lim\limits_{y \to A} g(y) = B$, то
      $\lim\limits_{x \to x_0} g(f(x)) = B$.
    answer: >-
      Неверно: $f(x) \equiv 0$, $g(y) = |\operatorname{sign} y|$; $g(f(x)) \equiv 0$, а $B = 1$. Верно при
      дополнительном условии: $g(A) = B$ или $f(x) \ne A$ в некоторой проколотой окрестности $x_0$.
    refs: [rem:colloq1:composite-counter, thm:lec07:composite, rem:colloq1:proof-function-props]

