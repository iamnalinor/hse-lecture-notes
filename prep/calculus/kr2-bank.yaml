# Банк вопросов генератора вариантов к КР-2 по матанализу (сайт: /calculus/kr2, раздел «Генератор вариантов»).
# Формат — context/markup.md §11, «Банк билетов». В PDF банк не попадает.
#
# about — подпись генератора: одна короткая фраза, что варианты неофициальные и тренировочные.
# ticket — восемь задач, по блоку тем на номер (лекции 6–13). Число задач и баллы КР-2 не объявлены:
# состав варианта — по одному типу задач страницы, непрерывность и асимптоты — в одном пункте.
# questions — id, kind (из ticket), topic (раздел sec:kr2:<topic> страницы), text, refs (задачи страницы
# и конспектов — с их решениями) и/или answer (ответ и ключевой шаг для новых задач).
# Каждый answer пересчитан (sympy).
# Строки с обратной косой чертой — без кавычек, в '…' или блоком >-; в "…" YAML съест «\».

